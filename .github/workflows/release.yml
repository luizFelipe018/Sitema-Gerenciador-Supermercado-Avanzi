name: Release

# Publica o instalador na Release do GitHub a cada tag v* (auto-update dos PCs)
# Uso: git tag v1.1.4 && git push origin v1.1.4
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: supermercado
        ports:
          - 3399:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Checar tipos
        run: npm run typecheck

      - name: Criar schema de teste
        run: mysql -h 127.0.0.1 -P 3399 -uroot -proot supermercado < src/__tests__/schema.sql

      - name: Rodar testes
        run: npm test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3399'
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: supermercado
          JWT_SECRET: test-secret

  release:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Credenciais NÃO entram mais no instalador: na primeira execução o app
      # cria %APPDATA%/Super Avanzi ERP/.env e pede ao administrador para preencher.
      - name: Buildar e publicar na Release
        run: npm run build:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
