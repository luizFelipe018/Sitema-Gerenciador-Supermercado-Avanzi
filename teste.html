<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio</title>

    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #eee;
        }

        .cardapio{
            width: 1080px;
            height: 1350px;
            position: relative;
            overflow: hidden;
        }

        /* Imagem de fundo */
        .fundo{
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;

            z-index: 0;
        }

        /* Imagem principal (banner) */
        .img-card{
            width: 100%;
            height: 640px;
            object-fit: cover;

            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Overlay lateral */
        .ret{
            width: 470px;
            height: 100%;
            background-color: #7415009f;

            position: absolute;
            top: 0;
            left: 555px;

            z-index: 2;
        }
        .img-card-text{
            width: 1080px;
            height: 1350px;
            position: absolute;
            top: 0;
            left: 0;

            z-index: 3;
        }
    </style>
</head>
<body>

    <div class="cardapio">
        <img src="Cardápio OK1.png" alt="Fundo" class="fundo">
        <img src="Frango ao Molho.jpg" alt="Prato" class="img-card">
        <img src="Cardápio texto.png" alt="" class="img-card-text">
        <div class="ret"></div>
    </div>

</body>
</html>
