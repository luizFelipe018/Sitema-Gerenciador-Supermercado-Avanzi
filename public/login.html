<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" 
    content="default-src 'self'; script-src 'self' https://cdn.tailwindcss.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' https://superavanzi.com.br; connect-src 'self' http://localhost:3000; font-src https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;">
    <title>Supermercado Avanzi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        red: { avanzi: '#b51515', dark: '#8a0f0f' }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-image: url('https://superavanzi.com.br/wp-content/uploads/2022/04/Fachada-inicio-768x432.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        input:focus {
            outline: none;
            border-color: #b51515;
            box-shadow: 0 0 0 3px rgba(181,21,21,0.12);
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .fade-up { animation: fadeUp 0.45s cubic-bezier(.22,.68,0,1.2) both; }
        .btn-login { transition: background 0.2s, transform 0.1s; }
        .btn-login:hover { background: #8a0f0f !important; }
        .btn-login:active { transform: scale(0.98); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">

    <div class="fade-up w-full max-w-sm mx-4 rounded-2xl overflow-hidden shadow-2xl" style="background: rgba(255,255,255,0.94); backdrop-filter: blur(10px);">

        <!-- Header vermelho -->
        <div style="background:#b51515;" class="px-8 py-7 text-center">
            <p class="text-white text-xs font-semibold tracking-widest uppercase mb-1 opacity-70">Sistema de Gestão</p>
            <h1 class="text-white text-2xl font-bold tracking-tight">Supermercado Avanzi</h1>
        </div>

        <!-- Formulário -->
        <div class="px-8 py-8 flex flex-col gap-4">

            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider" for="usuario">Usuário</label>
                <input
                    id="usuario"
                    type="text"
                    placeholder="Digite seu usuário"
                    class="border border-gray-200 rounded-lg px-4 py-2.5 text-sm text-gray-800 bg-white transition-all"
                />
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider" for="senha">Senha</label>
                <input
                    id="senha"
                    type="password"
                    placeholder="Digite sua senha"
                    class="border border-gray-200 rounded-lg px-4 py-2.5 text-sm text-gray-800 bg-white transition-all"
                />
            </div>

            <p id="erro" class="text-sm font-medium min-h-[18px]" style="color:#b51515;"></p>

            <button id="btn-login" class="btn-login text-white font-semibold rounded-lg py-3 text-sm w-full" style="background:#b51515;">
                Entrar
            </button>

        </div>

        <p class="text-center text-gray-300 text-xs pb-5">ERP Avanzi v1.0</p>
    </div>

    <script src="login.js"></script>
</body>
</html>
