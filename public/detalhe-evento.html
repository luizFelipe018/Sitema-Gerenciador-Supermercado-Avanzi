<!DOCTYPE html>
<html lang="pt-BR" data-theme="avanzi-dark">
<head>
    <meta charset="UTF-8">
    <meta id="meta-csp" http-equiv="Content-Security-Policy"
          content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; connect-src 'self' http://localhost:3000 http://localhost:3001 http://127.0.0.1:3000; font-src 'self' data:">
    <title>Detalhe do evento · ERP Avanzi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="assets/mirinho.ico">
    <link rel="stylesheet" href="design.css">
    <style>
        body { margin: 0; background: var(--bg); color: var(--text-1); font-family: Inter, system-ui, -apple-system, sans-serif; }
        .det-topo {
            position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px;
            height: 62px; padding: 0 24px; background: var(--surface-0);
            border-bottom: 1px solid var(--border);
        }
        .det-logo { width: 34px; height: 34px; border-radius: 8px; object-fit: contain; }
        .det-titulo { font-size: 13px; font-weight: 700; }
        .det-subtitulo { font-size: 11px; color: var(--text-3); }
        .det-topo-acoes { margin-left: auto; display: flex; gap: 8px; }
        .det-main { max-width: 1180px; margin: 0 auto; padding: 26px 24px 60px; }
        @media print {
            .det-topo-acoes { display: none; }
            body { background: #fff; color: #111; }
        }
    </style>
</head>
<body>
    <header class="det-topo">
        <img class="det-logo" src="assets/mirinho.png" alt="Super Avanzi">
        <div>
            <div class="det-titulo">Detalhe do evento</div>
            <div class="det-subtitulo">Auditoria · ERP Avanzi</div>
        </div>
        <div class="det-topo-acoes">
            <button class="ds-btn ds-btn-sm" onclick="window.print()">Imprimir</button>
            <button class="ds-btn ds-btn-sm ds-btn-primary" id="det-voltar">Voltar</button>
        </div>
    </header>

    <main class="det-main" id="det-conteudo">
        <div class="ds-card ds-card-pad">Carregando…</div>
    </main>

    <script src="shared.js"></script>
    <script src="pages/detalhe-evento.js"></script>
</body>
</html>
